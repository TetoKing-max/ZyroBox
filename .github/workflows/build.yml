name: CI & Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

jobs:
  build_debug:
    name: Build Arm64 FOSS Debug
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/zyro-debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # what makes these the official builds the module store answers; forks' runs never get it
          MODULE_STORE_KEY: ${{ secrets.MODULE_STORE_KEY }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          ./gradlew assembleArm64FossDebug --no-configuration-cache --no-daemon --console=plain --warning-mode summary

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zyro-box-arm64
          path: app/build/outputs/apk/arm64Foss/debug/*.apk
          # a debug apk is only for trying the build, after a week it's just eating actions storage
          retention-days: 30